name: Probe UNIDO IIP API

on:
  push:
    branches:
      - iip-volume-audit

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public IIP metadata and API schema
        shell: bash
        run: |
          mkdir -p iip-probe
          base=https://stat.unido.org/portal
          agent='World3-Empirical-reproducibility/0.10.2'
          curl --fail --silent --show-error --retry 3 -H "User-Agent: $agent" \
            "$base/dataset/getDataset/IIP" -o iip-probe/iip_metadata.json
          curl --fail --silent --show-error --retry 3 -H "User-Agent: $agent" \
            "$base/v3/api-docs/api" -o iip-probe/openapi.json
          python3 -m json.tool iip-probe/iip_metadata.json > iip-probe/iip_metadata.pretty.json

      - name: Record compact schema summaries
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("iip-probe")
          meta = json.loads((root / "iip_metadata.json").read_text())
          summary = {
              "top_level_keys": sorted(meta),
              "id": meta.get("id"),
              "name": meta.get("name"),
              "production_year": meta.get("production_year"),
              "dat_ins": meta.get("dat_ins"),
              "period_count": len(meta.get("periods", [])),
              "periods": meta.get("periods", []),
              "variables": meta.get("variables", []),
              "activities": meta.get("activities", []),
              "groups": meta.get("groups", []),
              "country_count": len(meta.get("countries", [])),
              "countries": meta.get("countries", []),
          }
          (root / "schema_summary.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          spec = json.loads((root / "openapi.json").read_text())
          paths = {
              key: value for key, value in spec.get("paths", {}).items()
              if "dataset" in key.lower() or "data" in key.lower()
          }
          schemas = (
              spec.get("components", {}).get("schemas", {})
              or spec.get("definitions", {})
          )
          (root / "openapi-relevant.json").write_text(
              json.dumps({"paths": paths, "schemas": schemas}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: unido-iip-schema
          path: iip-probe/
          if-no-files-found: error
          retention-days: 7
